<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>随机陈奕迅歌曲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;text-align:center;padding:40px 20px;font-family:system-ui}
.cover{width:280px;height:280px;margin:0 auto 24px;border-radius:14px;background:#222;background-size:cover;background-position:center}
.title{font-size:24px;margin-bottom:8px}
.artist{color:#aaa;margin-bottom:24px;font-size:17px}
audio{width:100%;max-width:440px}
.tip{margin-top:18px;color:#888;font-size:14px}
</style>
</head>
<body>
<div class="cover" id="cover"></div>
<div class="title" id="title">加载中...</div>
<div class="artist" id="artist">陈奕迅</div>
<audio id="audio" controls>
<div class="tip">刷新页面随机切换一首</div>

<script>
const songList = [
  {
    name: "十年",
    artist: "陈奕迅",
    cover: "https://p1.music.126.net/2ZDuEhs14Z3kmRYKt2sXYA==/109951164235881440.jpg",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
  },
  {
    name: "富士山下",
    artist: "陈奕迅",
    cover: "https://p1.music.126.net/ncO94G3cZ0n2YJbQzr5w0g==/109951165032002068.jpg",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
  },
  {
    name: "爱情转移",
    artist: "陈奕迅",
    cover: "https://p1.music.126.net/V0GkM0jI2y2lG6lF4YqL6Q==/109951163240027005.jpg",
    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
  }
];

const randomSong = songList[Math.floor(Math.random() * songList.length)];

const coverEl = document.getElementById("cover");
const titleEl = document.getElementById("title");
const audioEl = document.getElementById("audio");

coverEl.style.backgroundImage = `url(${randomSong.cover})`;
titleEl.innerText = randomSong.name;
audioEl.src = randomSong.url;
</script>
</body>
</html>
